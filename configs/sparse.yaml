# Audio Sparse-Transformer — il modello di Kavaki & Mandel.
#
# A differenza del denso, di questo il paper DICHIARA la configurazione
# (Tabella 1): N=4 token, P=36 campioni, d_token=64, d_encoder=128,
# L_rep=3, L_enc=8. Non c'e' nulla da ricostruire: si implementa.
#
# VERIFICA SUI VINCOLI DICHIARATI
#
#   parametri  2.822.711   dichiarati 2,87 M   ->  -1,6 %
#   costo      0,0485 GFLOP dichiarati 0,055   ->  -11,8 %
#
# Il conteggio dei parametri era stato PREDETTO a -0,8 % prima di scrivere
# una riga di codice, sommando i componenti a mano. E' la verifica piu'
# forte che la lettura del metodo sia corretta.
#
# La contraddizione della sez. 3.2 del paper ("96 dimensional feature" ma
# "196 kernels") si scioglie su SparseFormer, non sui nostri FLOPs. Il suo
# paragrafo "Model configurations" dice: "ResNet-like early convolutional
# layers (a 7x7 stride-2 convolution, a ReLU, and a 3x3 stride-2 max
# pooling) to extract initial 96-d image features". Novantasei canali, uno
# strato solo, la sequenza che implementiamo. Il 196 e' probabilmente
# contaminazione dai 196 patch di ViT, numero che SparseFormer stesso cita.
# La lettura alternativa c196_proj96 resta implementata: soddisfa entrambe
# le frasi del paper al prezzo di uno strato 1x1 mai nominato, e costa
# 0,58 punti sul denso.
#
# NIENTE CODIFICA POSIZIONALE, ed e' dichiarato: i token latenti non hanno
# un ordine intrinseco, sono un insieme e non una sequenza. Nel denso la
# questione e' aperta e la testiamo; qui aggiungerla sarebbe un errore
# concettuale.

defaults: base.yaml

model:
  kind: sparse

  # --- front-end: IDENTICO al denso, perche' il confronto sia controllato
  channel_reading: c96
  pool_stride: [2, 1]

  # --- estrattore sparso (tutto dichiarato dalla Tabella 1)
  num_tokens: 4                # N. DEVE essere un quadrato perfetto: le
                               # regioni si inizializzano su una griglia
                               # sqrt(N) x sqrt(N). Spiega perche' l'ablation
                               # del paper usa 4, 9, 16, 25, 36
  num_points: 36               # P campioni per token
  token_dim: 64                # d_token
  repeats: 3                   # L_rep
  hidden_div: 4                # la rete F ha dimensione nascosta d/4 = 16
  unit: 0.5                    # lato iniziale delle regioni, "half of the
                               # feature dimension"
  region_mode: learned         # [ABLATION, default = metodo del paper]
                               # "learned": regioni apprese + aggiustamento
                               #   per campione. E' il metodo.
                               # "grid": congelati `to_delta` e `box_init`
                               #   -> regioni fisse sulla griglia iniziale.
                               # Risponde alla domanda che il paper non pone:
                               # la saliency appresa serve, o basta la griglia?
                               # Il congelamento non cambia forma, parametri
                               # ne' FLOPs: il confronto resta controllato.
  region_constraint: none      # [NOSTRA VARIANTE, default = lettura letterale]
                               # "none": nulla impedisce alle regioni di uscire
                               #   dal piano. E' cio' che fanno il paper e
                               #   SparseFormer, ed e' il default.
                               # "clip": regione riportata dentro [0,1]^2.
                               # Misurato sul run di riferimento: con "none",
                               # dalla 2a ripetizione META' dei punti campionati
                               # cade fuori dal piano e legge il bordo. Con
                               # L_rep=1 il 100% resta dentro: la degenerazione
                               # e' cumulativa. Questa variante serve a decidere
                               # se l'1,31 che ci separa dal paper sia un
                               # difetto nostro o un limite del metodo.

  # --- transformer di classificazione
  dim: 128                     # d_encoder; un ponte lineare 64 -> 128
  depth: 8                     # L_enc
  num_heads: 4                 # [ASSUNZIONE] non dichiarato. 128/4 = 32,
                               # la dim/testa convenzionale. Misurato sul
                               # denso: params e FLOPs non cambiano col
                               # numero di teste, quindi e' scelta libera
  ffn_ratio: 4
  dropout: 0.0
  # nessun pos_encoding: assente per costruzione nel modello sparso
