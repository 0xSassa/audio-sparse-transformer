# Audio Sparse-Transformer, il modello di Kavaki & Mandel.
#
# Di questo il paper dichiara la configurazione completa (Tab. 1), quindi non
# c'e' nulla da ricostruire. Verifica sui vincoli dichiarati:
#
#   parametri  2.822.711    dichiarati 2,87 M    ->  -1,6 %
#   costo      0,0485 GFLOP dichiarati 0,055     -> -11,8 %
#
# I parametri tornano entro il 2 % su tutte e nove le configurazioni della
# Tabella 3.

defaults: base.yaml

model:
  kind: sparse

  channel_reading: c96         # front-end identico al denso, cosi' il
  pool_stride: [2, 1]          # confronto e' controllato

  num_tokens: 4                # N. DEVE essere un quadrato perfetto: le regioni
                               # partono da una griglia sqrt(N) x sqrt(N), da cui
                               # l'ablation del paper su 4, 9, 16, 25, 36
  num_points: 36               # P, campioni per token
  token_dim: 64                # d_token
  repeats: 3                   # L_rep
  hidden_div: 4                # la rete F ha dimensione nascosta d/4 = 16
  unit: 0.5                    # lato iniziale delle regioni, "half of the
                               # feature dimension"
  region_mode: learned         # [ABLATION, default = metodo del paper]
                               # "grid" congela regioni e aggiustamento senza
                               # cambiare forma, parametri ne' FLOPs: misura
                               # quanto vale la saliency appresa
  region_constraint: none      # [VARIANTE, default = lettura letterale] nulla
                               # tiene le regioni dentro il piano, come nel
                               # paper e in SparseFormer; "clip" le riporta
                               # dentro [0,1]^2

  dim: 128                     # d_encoder; un ponte lineare porta 64 -> 128
  depth: 8                     # L_enc
  num_heads: 4                 # [ASSUNZIONE] non dichiarato; 32 dimensioni per
                               # testa
  ffn_ratio: 4
  dropout: 0.0
  # Nessuna codifica posizionale, ed e' dichiarato: i token latenti sono un
  # insieme, non una sequenza.
