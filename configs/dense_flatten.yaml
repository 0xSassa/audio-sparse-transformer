# Dense-transformer, ricostruzione `flatten`: la lettura ADOTTATA, da cui
# vengono i risultati riportati. Identica a dense.yaml tranne `seq_mode`.
#
# `flatten` conserva la struttura spettrale, quindi ogni token porta
# 96 x 16 = 1536 valori invece dei 96 di `pool_freq`. E' la tokenizzazione di
# KWT sullo stesso dataset: "the spectrogram is first mapped to a higher
# dimension d, using a linear projection matrix W0 in R^{FxD} in the frequency
# domain". Qui: 5.197.795 parametri (+8,3 %), 0,5604 GFLOP (-13,1 %).

defaults: base.yaml

model:
  kind: dense
  channel_reading: c96
  pool_stride: [2, 1]

  seq_mode: flatten            # l'unica differenza da dense.yaml

  dim: 224
  depth: 8
  num_heads: 7
  ffn_ratio: 4
  dropout: 0.0
