# Dense-transformer, ricostruzione `pool_freq`: la lettura SCARTATA. Quella
# adottata, da cui vengono i risultati riportati, e' dense_flatten.yaml.
#
# Del denso il paper dichiara solo 4,80 M parametri e 0,645 GFLOP (Tab. 2), e
# nessun `dim` soddisfa entrambi i vincoli: 224 minimizza il peggiore dei due
# scarti. Qui: 4.875.235 parametri (+1,6 %), 0,5275 GFLOP (-18,2 %).

defaults: base.yaml            # i blocchi non ripetuti qui vengono da la'

model:
  kind: dense

  channel_reading: c96         # "96 dimensional feature" (sez. 3.2); il "196
                               # kernels" due righe dopo e' un refuso, come
                               # conferma SparseFormer. La lettura alternativa
                               # e' c196_proj96
  pool_stride: [2, 1]          # [ASSUNZIONE] solo sull'asse frequenza:
                               # dimezzare anche il tempo lascerebbe 26 frame,
                               # cioe' un passo di 40 ms

  seq_mode: pool_freq          # media sull'asse frequenza: 51 token da 96
                               # valori, contro i 1536 di `flatten`

  dim: 224
  depth: 8                     # dichiarato: "8 transformer-encoders"
  num_heads: 7                 # 32 dimensioni per testa, come nello sparso
  ffn_ratio: 4
  dropout: 0.0
  # [ASSUNZIONE] nessuna codifica posizionale: il paper la dichiara assente
  # sullo sparso e tace sul denso, quindi assente per simmetria.
