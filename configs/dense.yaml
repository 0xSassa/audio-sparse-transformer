# Dense-transformer: il baseline del confronto controllato di Kavaki & Mandel.
#
# Del modello denso il paper NON dichiara alcun iperparametro: solo 4.80 M
# parametri e 0.645 G FLOPs (Tabella 2). Questa configurazione e' quindi una
# RICOSTRUZIONE, ottenuta cercando fra 432 combinazioni quelle compatibili
# con quei due numeri.
#
#   parametri  4.875.235   dichiarati 4,80 M   ->  +1,6 %
#   costo      0,5275 GFLOP dichiarati 0,645   ->  -18,2 %
#
# Lo scarto sul costo resta NON SPIEGATO. L'ipotesi degli strati convolutivi
# aggiuntivi e' stata testata e confutata (2 conv -> +164 %). Il front-end
# tempo-frequenza, che nessun contatore include, vale ~0,8 % del modello e
# quindi non lo spiega.

defaults: base.yaml            # i blocchi non ripetuti qui vengono da la'

model:
  kind: dense

  # --- front-end convolutivo ------------------------------------------
  channel_reading: c96         # "96 dimensional feature". Il "196 kernels"
                               # della sez. 3.2 e' un refuso: SparseFormer,
                               # l'ancestor del metodo, usa 96 canali e un
                               # solo strato 7x7 stride 2. c196_proj96 resta
                               # implementata come lettura alternativa e vale
                               # 0,58 punti in piu' qui (94,67 vs 94,09).
  pool_stride: [2, 1]          # DEDOTTO: solo sull'asse frequenza. Con (2,2)
                               # la sequenza scende a 26 frame e il costo si
                               # ferma al 45 % di quello dichiarato, contro
                               # l'87 % con (2,1). SparseFormer usa pero'
                               # stride 2 su ENTRAMBI gli assi: qui ci si
                               # discosta, ed e' la deduzione piu' fragile.

  # --- dalla feature map alla sequenza --------------------------------
  seq_mode: pool_freq          # [ASSUNZIONE] la scelta meno sicura di tutte:
                               # media sull'asse frequenza. Si addestra anche
                               # la variante flatten (vedi dense_flatten.yaml)

  # --- encoder --------------------------------------------------------
  dim: 224
  depth: 8                     # DICHIARATO dal paper: "8 transformer-encoders"
  num_heads: 7                 # 224/7 = 32, la dim/testa convenzionale.
                               # Misurato: params e FLOPs identici per 4/7/8/14
  ffn_ratio: 4
  # Nessuna codifica posizionale: il paper la dichiara assente sullo sparso e
  # tace sul denso. E' una nostra ASSUNZIONE, presa per simmetria; testarla
  # era previsto e non e' stato fatto.
  dropout: 0.0

# Sequenza risultante: [C=96, F=16, T=51]  ->  51 token di dimensione 96

