# Configurazione comune; dense.yaml, dense_flatten.yaml e sparse.yaml
# ereditano da qui. Ogni valore marcato [ASSUNZIONE] non e' dichiarato dal
# paper di Kavaki & Mandel: e' una scelta nostra.

seed: 0
deterministic: true             # costa tempo per epoca, ma rende i run
                                # bit-identici e il resume trasparente

data:
  cache_dir: data/cache
  num_classes: 35
  sample_rate: 16000
  clip_samples: 16000
  num_workers: 4

features:                       # [ASSUNZIONE] il paper non dichiara nulla di
  type: log_mel                 # questo blocco. 400/160 @ 16 kHz = 25 ms / 10 ms
  n_fft: 400                    # (AST: 25/10; KWT: 30/10), quindi 101 frame per
  hop_length: 160               # clip da 1 s e F=16 dopo lo stem. I 64 bin
  n_mels: 64                    # stanno fra i 40 di KWT e i 128 di AST
  f_min: 20.0
  f_max: 7600.0
  top_db: 80.0

augment:                        # dichiarate dal paper: "mixing and phasemix",
  names: [mixing, phasemix]     # implementate seguendo batch_augs.py di EAT
  mix_ratio: 1.0                # probabilita' di mescolare; 1 = sempre, default
                                # di EAT
  epoch_mix: -1                 # epoca sotto cui il mixing resta spento, come
                                # in EAT; -1 = sempre attivo
  lam_label_threshold: 0.9      # oltre questo lam la seconda etichetta cade
                                # lam: mixing ~ U[0.1,1], phasemix ~ U[0,1]

optim:
  # AdamW e one-cycle sono dichiarati dal paper e cablati nel codice: non
  # compaiono qui perche' non c'e' nulla da scegliere.
  lr: 0.0003                    # dichiarato
  betas: [0.9, 0.99]            # dichiarato
  eps: 1.0e-8                   # dichiarato
  weight_decay: 1.0e-5          # dichiarato
  wd_skip_1d_params: true       # EAT esclude dal decay ogni parametro con
                                # len(shape)==1: bias e norme
  pct_start: 0.1                # parametri di one-cycle, dal trainer.py di EAT
  div_factor: 25.0
  final_div_factor: 10000.0
  batch_size: 64                # dichiarato
  epochs: 100                   # [ASSUNZIONE] nessuna fonte lo fissa
  ema_decay: 0.995              # dichiarato
  # La loss e' la BCE su target multi-hot (ramo 'bce' di EAT), cablata: il
  # mixing produce due etichette per campione, quindi la CE non e' applicabile.

eval:
  use_ema: true
  test_once: true

log:
  dir: results
  tensorboard: true
