# Configurazione comune a tutti gli esperimenti.
# I file dense.yaml / sparse.yaml erediteranno da qui sovrascrivendo `model`.
#
# Ogni valore marcato [ASSUNZIONE] non e' dichiarato dal paper di
# Kavaki & Mandel: e' una scelta nostra, e come tale va riportata
# nel README e discussa all'orale.

seed: 0
deterministic: true             # +10% sul tempo, ma i run diventano
                                # bit-identici e il resume esattamente
                                # trasparente. Misurato: senza, due run
                                # identici differiscono di 0,02 punti.

data:
  cache_dir: data/cache
  num_classes: 35
  sample_rate: 16000
  clip_samples: 16000
  num_workers: 4

features:                       # [ASSUNZIONE] il paper non dichiara nulla di
  type: log_mel                 #   questo blocco. Misurato: la scelta di n_mels
  n_fft: 400                    #   e' quasi piatta (0.8 punti su un fattore 4).
  hop_length: 160               #   400/160 @16 kHz = finestra 25 ms, hop 10 ms
  n_mels: 64                    #   -> 101 frame per clip da 1 s; F=16 dopo lo stem
  f_min: 20.0
  f_max: 7600.0
  top_db: 80.0
                                # Niente normalizzazione per-campione: era una
                                # nostra aggiunta, la sonda lineare la boccia
                                # (-0.5 punti) e ne' il paper ne' gli ancestor
                                # la usano. Rimossa dal codice, non spenta.

# La normalizzazione dello stem non e' un'opzione: e' LayerNorm sui canali
# DOPO il pooling, come nel codice di SparseFormer. Le varianti batchnorm e
# "none" sono state rimosse dal modello perche' nessun run le ha mai usate.

augment:                        # dichiarate dal paper: "mixing and phasemix [1]"
  names: [mixing, phasemix]     # implementate seguendo datasets/batch_augs.py di EAT
  mix_ratio: 1.0                # probabilita' di mescolare. DEFAULT DI EAT = 1,
                                # cioe' SEMPRE. Avevamo assunto 0.5: sbagliato.
  epoch_mix: -1                 # soglia di epoca sotto cui il mixing e' spento
                                # (EAT lo usa per partire su dati puliti).
                                # -1 = sempre attivo
  lam_label_threshold: 0.9      # oltre questo lam la seconda etichetta cade
                                # lam: mixing ~ U[0.1,1], phasemix ~ U[0,1] (da EAT)

optim:
  # AdamW e one-cycle sono DICHIARATI dal paper (sez. 3.2) e sono cablati nel
  # codice: non compaiono qui come chiavi perche' non c'e' nulla da scegliere,
  # e una chiave che il codice non legge e' una scelta che non esiste.
  lr: 0.0003                    # dichiarato
  betas: [0.9, 0.99]            # dichiarato
  eps: 1.0e-8                   # dichiarato
  weight_decay: 1.0e-5          # dichiarato
  wd_skip_1d_params: true       # EAT esclude dal decay ogni parametro con
                                # len(shape)==1: bias, LayerNorm, BatchNorm.
                                # Non e' una nostra aggiunta, e' il riferimento.
  pct_start: 0.1                # parametri di one-cycle, dal trainer.py di EAT
  div_factor: 25.0              # default PyTorch, usato da EAT
  final_div_factor: 10000.0     # default PyTorch, usato da EAT
  batch_size: 64                # dichiarato
  epochs: 100                   # [ASSUNZIONE] unico iperparametro di training
                                # che nessuna fonte fissa
  ema_decay: 0.995              # dichiarato
                                # La loss e' la BCE su target multi-hot (ramo
                                # 'bce' di EAT), cablata: il mixing produce due
                                # etichette per campione, quindi la CE non e'
                                # applicabile e non c'e' scelta da esporre.

eval:
  use_ema: true                 # si valuta il modello EMA
  test_once: true               # il test set si tocca una sola volta

log:
  dir: results
  tensorboard: true
  # Il tracciamento vive in due posti e basta: `metrics.csv` nella cartella del
  # run — la fonte da cui plot_results.py ricostruisce ogni figura — e i log
  # TensorBoard. Weights & Biases era la terza destinazione ed e' stato
  # rimosso: il confronto fra run che lo giustificava lo fa gia' il CSV, e un
  # servizio con account e rete e' un requisito in piu' per chi riproduce.
