# Configurazione comune a tutti gli esperimenti.
# I file dense.yaml / sparse.yaml erediteranno da qui sovrascrivendo `model`.
#
# Ogni valore marcato [ASSUNZIONE] non e' dichiarato dal paper di
# Kavaki & Mandel: e' una scelta nostra, e come tale va riportata
# nel README e discussa all'orale.

seed: 0
deterministic: false

data:
  cache_dir: data/cache
  num_classes: 35
  sample_rate: 16000
  clip_samples: 16000
  num_workers: 4

features:                       # [ASSUNZIONE] — il paper non dichiara nulla
  type: log_mel                 #   di questo blocco. E' il parametro libero
  n_fft: 400                    #   piu' impattante dell'intera riproduzione.
  hop_length: 160               #   400/160 @16 kHz = finestra 25 ms, hop 10 ms
  n_mels: 64                    #   -> 101 frame per clip da 1 s
  f_min: 20.0
  f_max: 7600.0
  top_db: 80.0
  normalize: true               # normalizzazione per-campione (livello variabile in SC-V2)

augment:                        # dichiarate dal paper: "mixing and phasemix [1]"
  names: [mixing, phasemix]
  alpha: 0.2                    # [ASSUNZIONE] — EAT non dichiara il Beta
  prob: 0.5                     # [ASSUNZIONE] — probabilita' di applicarne una

optim:                          # tutto dichiarato dal paper, sez. 3.2
  optimizer: adamw
  lr: 0.0003
  betas: [0.9, 0.99]
  eps: 1.0e-8
  weight_decay: 1.0e-5
  scheduler: one_cycle
  batch_size: 64
  epochs: 100                   # [ASSUNZIONE] — il paper non dichiara le epoche
  ema_decay: 0.995
  loss: bce                     # obbligata dai target mixati

eval:
  metric: accuracy
  use_ema: true                 # si valuta il modello EMA
  test_once: true               # il test set si tocca una sola volta

log:
  dir: results
  tensorboard: true
